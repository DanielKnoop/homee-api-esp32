; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = *_env.ini
; `pio run` baut nur die Firmware-Umgebungen; env:native laeuft ueber
; `pio test -e native` und hat bewusst kein main().
default_envs = esp32doit-devkit-v1, um_tinys3, seeed_xiao_esp32s3, nodemcuv2

[common_env_data]
lib_deps =
	bblanchon/ArduinoJson@^7.4.3

[common_esp32]
lib_deps =
	${common_env_data.lib_deps}
	ESP32Async/ESPAsyncWebServer@^3.11.0
	ESP32Async/AsyncTCP@^3.4.10

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
	${common_esp32.lib_deps}
build_flags =
	${wlancredentials.build_flags_wlan}
	-DEXAMPLE_BUILD
	-DDEBUG_VIRTUAL_HOMEE

[env:um_tinys3]
platform = espressif32
board = um_tinys3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
	${common_esp32.lib_deps}
build_flags =
	${wlancredentials.build_flags_wlan}
	-DEXAMPLE_BUILD
	-DDEBUG_VIRTUAL_HOMEE
	-DESP_PLATFORM

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
	${common_esp32.lib_deps}
build_flags =
	${wlancredentials.build_flags_wlan}
	-DEXAMPLE_BUILD
	-DDEBUG_VIRTUAL_HOMEE
	-DESP_PLATFORM



[env:nodemcuv2]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
lib_deps =
	${common_env_data.lib_deps}
	mathieucarbou/ESPAsyncWebServer@^3.6.0
	esphome/ESPAsyncTCP-esphome@^2.0.0
	me-no-dev/ESPAsyncUDP
build_flags =
	${wlancredentials.build_flags_wlan}
	-DEXAMPLE_BUILD
	-DDEBUG_VIRTUAL_HOMEE

; Host-Tests. Laufen ohne Hardware: node, nodeAttributes und nodes brauchen
; von Arduino nur String, der in test/mocks/Arduino.h nachgebildet wird.
; virtualHomee.cpp ist ausgeklammert — es haengt an WiFi und AsyncWebServer.
;   Aufruf:  pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
	-<*>
	+<virtualHomee/node.cpp>
	+<virtualHomee/nodeattributes.cpp>
	+<virtualHomee/nodes.cpp>
build_flags =
	-std=c++17
	-I src
	-I test/mocks
	-include Arduino.h
	-DARDUINOJSON_ENABLE_ARDUINO_STRING=1
	; Unity vergleicht double nur mit aktivierter Double-Unterstuetzung
	-DUNITY_INCLUDE_DOUBLE
	-DUNITY_DOUBLE_PRECISION=1e-9
lib_deps =
	${common_env_data.lib_deps}
